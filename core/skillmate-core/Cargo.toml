[package]
name = "skillmate-core"
version = "0.1.0"
description = "SkillMate core library (UI-free)"
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.11"
dirs = "7"
chrono = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "1.1"
ureq = { version = "3.4", features = ["json"] }

[target.'cfg(windows)'.dependencies]
junction = "2.1"
